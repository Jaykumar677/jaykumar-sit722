name: build-test-push

on:
  push:
    branches:
      - testing

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Customer Service 
      - name: Install dependencies (customer_service)
        run: |
          cd backend/customer_service
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests (customer_service)
        run: |
          cd backend/customer_service
          pytest -v

      #  Order Service 
      - name: Install dependencies (order_service)
        run: |
          cd backend/order_service
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests (order_service)
        run: |
          cd backend/order_service
          pytest -v

      # Product Service 
      - name: Install dependencies (product_service)
        run: |
          cd backend/product_service
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests (product_service)
        run: |
          cd backend/product_service
          pytest -v

      # Azure Login 
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      #  Build & Push Docker 
      - name: Build and Push Docker image
        run: |
          az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/order_service:latest ./backend/order_service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/order_service:latest
