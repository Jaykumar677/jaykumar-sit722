name: build-test-push

on:
  push:
    branches:
      - testing
      - main
      - feature/integration-tests

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Start Postgres container
        run: |
          docker run -d \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=testdb \
            -p 5432:5432 \
            --name postgres \
            postgres:14

      - name: Wait for Postgres
        run: |
          until docker exec postgres pg_isready -U postgres; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Create test databases
        run: |
          docker exec -e PGPASSWORD=postgres postgres psql -U postgres -c "CREATE DATABASE customers;"
          docker exec -e PGPASSWORD=postgres postgres psql -U postgres -c "CREATE DATABASE orders;"
          docker exec -e PGPASSWORD=postgres postgres psql -U postgres -c "CREATE DATABASE products;"

      - name: Install dependencies (customer_service)
        run: pip install -r backend/customer_service/requirements.txt

      # Customer Service
      - name: Install dependencies (customer_service)
        run: |
          cd backend/customer_service
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests (customer_service)
        run: |
          cd backend/customer_service
          pytest -v

      # Order Service
      - name: Install dependencies (order_service)
        run: |
          cd backend/order_service
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests (order_service)
        run: |
          cd backend/order_service
          pytest -v

      # Product Service
      - name: Install dependencies (product_service)
        run: |
          cd backend/product_service
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests (product_service)
        run: |
          cd backend/product_service
          pytest -v

      # Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Build & Push Docker
      - name: Build and Push Docker image (order_service)
        run: |
          az acr login --name jaykumaracr722
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/order_service:latest -f backend/order_service/Dockerfile ./backend/order_service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/order_service:latest

      - name: Build and Push Docker image (customer_service)
        run: |
          az acr login --name jaykumaracr722
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/customer_service:latest -f backend/customer_service/Dockerfile ./backend/customer_service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/customer_service:latest

      - name: Build and Push Docker image (product_service)
        run: |
          az acr login --name jaykumaracr722
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/product_service:latest -f backend/product_service/Dockerfile ./backend/product_service
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/product_service:latest

      - name: Build and Push Docker image (frontend)
        run: |
          az acr login --name jaykumaracr722
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest -f frontend/Dockerfile ./frontend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest



  # Stage 2: Deploy to Staging (ACI)
  deploy-staging:
    needs: build-test-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/integration-tests'

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Order Service to Staging
        run: |
          az container create \
            --resource-group sit722-prod-rg \
            --name order-service-staging \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/order_service:latest \
            --cpu 1 --memory 1 \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 8000 \
            --os-type Linux \
            --dns-name-label order-service-${{ github.run_id }}

      - name: Deploy Customer Service to Staging
        run: |
          az container create \
            --resource-group sit722-prod-rg \
            --name customer-service-staging \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/customer_service:latest \
            --cpu 1 --memory 1 \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 8000 \
            --os-type Linux \
            --dns-name-label customer-service-${{ github.run_id }}

      - name: Deploy Product Service to Staging
        run: |
          az container create \
            --resource-group sit722-prod-rg \
            --name product-service-staging \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/product_service:latest \
            --cpu 1 --memory 1 \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 8000 \
            --os-type Linux \
            --dns-name-label product-service-${{ github.run_id }}

      - name: Verify staging deployment
        run: |
          echo "Staging environment deployed. Access services at:"
          echo "Order Service: http://order-service-${{ github.run_id }}.australiaeast.azurecontainer.io:8000"
          echo "Customer Service: http://customer-service-${{ github.run_id }}.australiaeast.azurecontainer.io:8000"
          echo "Product Service: http://product-service-${{ github.run_id }}.australiaeast.azurecontainer.io:8000"



  # Stage 2.5: Run Integration Tests on Staging
  integration-tests:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install test dependencies
        run: pip install pytest requests

      # 🔹 NEW Wait until services are healthy
      - name: Wait for services to be ready
        run: |
          for url in \
            $CUSTOMER_API/health \
            $ORDER_API/health \
            $PRODUCT_API/health
          do
            echo "Checking $url ..."
            for i in {1..15}; do
              if curl -sSf $url > /dev/null; then
                echo "$url is ready ✅"
                break
              fi
              echo "⏳ Waiting for $url ..."
              sleep 10
            done
          done
        env:
          CUSTOMER_API: http://customer-service-staging-${{ github.run_id }}.australiaeast.azurecontainer.io:8000
          ORDER_API: http://order-service-staging-${{ github.run_id }}.australiaeast.azurecontainer.io:8000
          PRODUCT_API: http://product-service-staging-${{ github.run_id }}.australiaeast.azurecontainer.io:8000

      - name: Run integration tests on staging
        run: pytest integration_tests/test_services.py -v
        env:
          CUSTOMER_API: http://customer-service-staging-${{ github.run_id }}.australiaeast.azurecontainer.io:8000
          ORDER_API: http://order-service-staging-${{ github.run_id }}.australiaeast.azurecontainer.io:8000
          PRODUCT_API: http://product-service-staging-${{ github.run_id }}.australiaeast.azurecontainer.io:8000

      - name: Destroy staging environment
        if: always()
        run: |
          az container delete --resource-group sit722-prod-rg --name order-service-staging --yes
          az container delete --resource-group sit722-prod-rg --name customer-service-staging --yes
          az container delete --resource-group sit722-prod-rg --name product-service-staging --yes



  # Stage 3: Deploy to Production (ACI)
  deploy-production:
    needs: integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy PostgreSQL (shared instance, multiple DBs)
      - name: Deploy PostgreSQL to Production
        run: |
          az container create \
            --resource-group sit722-prod-rg \
            --name postgres-prod \
            --image postgres:14 \
            --cpu 1 --memory 1 \
            --ports 5432 \
            --os-type Linux \
            --dns-name-label postgres-prod-${{ github.run_id }} \
            --environment-variables POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=postgres \
            --ip-address Public

      - name: Wait for PostgreSQL
        run: |
          for i in {1..15}; do
            PGHOST=$(az container show --resource-group sit722-prod-rg --name postgres-prod --query ipAddress.ip --output tsv)
            if nc -z $PGHOST 5432; then
              echo "Postgres is ready!"
              break
            fi
            echo "⏳ Waiting for Postgres..."
            sleep 5
          done

      - name: Create Databases
        run: |
          PGHOST=$(az container show --resource-group sit722-prod-rg --name postgres-prod --query ipAddress.ip --output tsv)
          export PGPASSWORD=postgres
          psql -h $PGHOST -U postgres -d postgres -c "CREATE DATABASE customers;"
          psql -h $PGHOST -U postgres -d postgres -c "CREATE DATABASE orders;"
          psql -h $PGHOST -U postgres -d postgres -c "CREATE DATABASE products;"

      - name: Deploy Order Service to Production
        run: |
          az container create \
            --resource-group sit722-prod-rg \
            --name order-service-prod \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/order_service:latest \
            --cpu 1 --memory 1 \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 8000 \
            --os-type Linux \
            --dns-name-label order-service-prod-${{ github.run_id }} \
            --ip-address Public \
            --environment-variables DATABASE_URL=postgresql://postgres:postgres@postgres-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:5432/orders

      - name: Deploy Customer Service to Production
        run: |
          az container create \
            --resource-group sit722-prod-rg \
            --name customer-service-prod \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/customer_service:latest \
            --cpu 1 --memory 1 \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 8000 \
            --os-type Linux \
            --dns-name-label customer-service-prod-${{ github.run_id }} \
            --ip-address Public \
            --environment-variables DATABASE_URL=postgresql://postgres:postgres@postgres-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:5432/customers

      - name: Deploy Product Service to Production
        run: |
          az container create \
            --resource-group sit722-prod-rg \
            --name product-service-prod \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/product_service:latest \
            --cpu 1 --memory 1 \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 8000 \
            --os-type Linux \
            --dns-name-label product-service-prod-${{ github.run_id }} \
            --ip-address Public \
            --environment-variables DATABASE_URL=postgresql://postgres:postgres@postgres-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:5432/products

      - name: Deploy Frontend to Production
        run: |
          az container create \
            --resource-group sit722-prod-rg \
            --name frontend-prod \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest \
            --cpu 1 --memory 1 \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --ports 80 \
            --os-type Linux \
            --dns-name-label frontend-prod-${{ github.run_id }} \
            --ip-address Public \
            --environment-variables \
              CUSTOMER_API=http://customer-service-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:8000 \
              ORDER_API=http://order-service-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:8000 \
              PRODUCT_API=http://product-service-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:8000

      - name: Confirm Production Deployment
        run: |
          echo "Production deployment complete. Access your services at:"
          echo "Order Service:    http://order-service-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:8000"
          echo "Customer Service: http://customer-service-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:8000"
          echo "Product Service:  http://product-service-prod-${{ github.run_id }}.australiaeast.azurecontainer.io:8000"
          echo "Frontend:  http://frontend-prod-${{ github.run_id }}.australiaeast.azurecontainer.io"
