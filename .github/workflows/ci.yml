name: CI Pipeline

on:
  push:
    branches: [ testing ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (customer_service)
        working-directory: ./backend/customer_service
        run: pip install -r requirements-dev.txt

      - name: Run tests (customer_service)
        working-directory: ./backend/customer_service
        run: pytest -v

      - name: Install dependencies (order_service)
        working-directory: ./backend/order_service
        run: pip install -r requirements-dev.txt

      - name: Run tests (order_service)
        working-directory: ./backend/order_service
        run: pytest -v

      - name: Install dependencies (product_service)
        working-directory: ./backend/product_service
        run: pip install -r requirements-dev.txt

      - name: Run tests (product_service)
        working-directory: ./backend/product_service
        run: pytest -v

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/sit722-app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
