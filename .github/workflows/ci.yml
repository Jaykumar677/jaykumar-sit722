name: CI Pipeline 

on:
  push:
    branches: [ testing ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [customer_service, order_service, product_service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r backend/${{ matrix.service }}/requirements.txt
          pip install pytest
        working-directory: ./ 

      - name: Run tests
        run: pytest
        working-directory: ./backend/${{ matrix.service }}

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend/${{ matrix.service }}
          docker push "$IMAGE"
