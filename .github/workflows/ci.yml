name: CI Pipeline

on:
  push:
    branches: [ testing ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies (customer_service)
        working-directory: ./backend/customer_service
        run: pip install -r requirements-dev.txt

      - name: Install dependencies (order_service)
        working-directory: ./backend/order_service
        run: pip install -r requirements-dev.txt

      - name: Install dependencies (product_service)
        working-directory: ./backend/product_service
        run: pip install -r requirements-dev.txt

      # Create test databases
      - name: Create test databases
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE customers;"
          psql -h localhost -U postgres -c "CREATE DATABASE orders;"
          psql -h localhost -U postgres -c "CREATE DATABASE products;"
        env:
          PGPASSWORD: postgres

      - name: Run tests (customer_service)
        working-directory: ./backend/customer_service
        run: pytest -v

      - name: Run tests (order_service)
        working-directory: ./backend/order_service
        run: pytest -v

      - name: Run tests (product_service)
        working-directory: ./backend/product_service
        run: pytest -v
